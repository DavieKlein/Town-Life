name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout (with Butano submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make sure Python 3 is available
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
          python3 --version

      - name: Build ROM
        run: make -j"$(nproc)"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: town-life
          path: town-life.gba
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: town-life

      - name: Publish release "latest" (replaces the previous one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          # Make sure the tag is really gone before recreating it.
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" >/dev/null 2>&1 || true
          # Also publish a copy with a unique name per build: phones and emulators (Lemuroid keeps
          # its own copy per file name) would otherwise keep showing an old town-life.gba.
          STAMP="$(date -u +%Y%m%d-%H%M)"
          cp town-life.gba "town-life-${STAMP}.gba"
          gh release create latest town-life.gba "town-life-${STAMP}.gba" \
            --target "${GITHUB_SHA}" \
            --title "Town Life (latest build ${STAMP})" \
            --notes "Automatic build of commit ${GITHUB_SHA} on main (${STAMP} UTC). On a phone, download town-life-${STAMP}.gba (unique name, so the emulator can't mix it up with an old version) and open it in Lemuroid." \
            --latest
